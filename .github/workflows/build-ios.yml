name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Fix Storyboard & Project iOS 18.1 Target (Ruby Patch)
        run: |
          ruby -e '
            # Fix all storyboard files
            Dir.glob("ios/**/*.storyboard").each do |f|
              content = File.read(f, encoding: "UTF-8")
              new_content = content.gsub("18.1", "16.0").gsub(/targetVersion="[0-9.]*"/, "targetVersion=\"16.0\"")
              File.write(f, new_content)
              puts "Patched Storyboard: #{f}"
            end

            # Fix pbxproj files
            Dir.glob("ios/**/*.pbxproj").each do |f|
              content = File.read(f, encoding: "UTF-8")
              new_content = content.gsub("18.1", "16.0").gsub(/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/, "IPHONEOS_DEPLOYMENT_TARGET = 16.0")
              File.write(f, new_content)
              puts "Patched Project: #{f}"
            end
          '

      - name: Install Pods
        run: npx pod-install ios

      - name: Disable Code Signing for Pods
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "16.0"
              end
            end
            project.save
          '

      - name: Build Unsigned App
        run: |
          cd ios
          set -o pipefail
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
                     build | tee xcodebuild.log

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: .app file was not generated by xcodebuild!"
            exit 1
          fi

          echo "✅ Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa