name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Fix iOS 18.1 SDK Missing Error (Force target to 16.0)
        run: |
          LC_ALL=C find ios -type f \( -name "*.pbxproj" -o -name "*.storyboard" -o -name "*.plist" -o -name "*.xcworkspacedata" \) -exec sed -i '' 's/18\.1/16.0/g' {} +
          LC_ALL=C find ios -type f -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' {} +

      - name: Install Pods
        run: npx pod-install ios

      - name: Disable Code Signing for Pods
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "16.0"
              end
            end
            project.save
          '

      - name: Build Unsigned Archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath output/SchoolApp.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
                     archive | tee xcodebuild.log || {
                       echo "==================== LAST BUILD LOGS ===================="
                       tail -n 120 xcodebuild.log
                       exit 1
                     }

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/output/SchoolApp.xcarchive/Products/Applications/*.app Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa