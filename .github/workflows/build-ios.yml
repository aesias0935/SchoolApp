name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Patch Storyboard SDK Version
        run: |
          # SplashScreen.storyboard 내 하드코딩된 iOS 18.1 요구사항을 16.0으로 패치
          find ios -name "*.storyboard" -exec sed -i '' 's/version="18.1"/version="16.0"/g' {} +
          find ios -name "*.storyboard" -exec sed -i '' 's/targetRuntime="iOS.CocoaTouch.18.1"/targetRuntime="iOS.CocoaTouch"/g' {} +
          find ios -name "*.storyboard" -exec sed -i '' 's/18.1/16.0/g' {} +

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing for Pods
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              end
            end
            project.save
          '

      - name: Archive Unsigned App
        run: |
          cd ios
          set -o pipefail
          export NODE_BINARY=$(which node)
          
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath "$(pwd)/build/SchoolApp.xcarchive" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     SKIP_INSTALL=NO \
                     archive 2>&1 | tee xcodebuild.log || {
                       echo "### ❌ Xcode Archive Error Log" >> $GITHUB_STEP_SUMMARY
                       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                       grep -E "error:|BUILD FAILED" xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY
                       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                       exit 1
                     }

      - name: Package Unsigned IPA from Archive
        run: |
          rm -rf Payload app-unsigned.ipa
          mkdir -p Payload

          ARCHIVE_APP=$(find ios -name "SchoolApp.app" -type d | grep -i "xcarchive" | head -n 1)

          if [ -z "$ARCHIVE_APP" ]; then
            ARCHIVE_APP=$(find ios -name "SchoolApp.app" -type d | head -n 1)
          fi

          if [ -z "$ARCHIVE_APP" ]; then
            echo "❌ ERROR: Archived SchoolApp.app not found!"
            exit 1
          fi

          echo "✅ Found App Bundle at: $ARCHIVE_APP"

          cp -R "$ARCHIVE_APP" Payload/

          PLIST_FILE="Payload/SchoolApp.app/Info.plist"
          if [ -f "$PLIST_FILE" ]; then
            plutil -replace CFBundleIdentifier -string "com.aesias.SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleExecutable -string "SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleName -string "SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleDisplayName -string "SchoolApp" "$PLIST_FILE" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$PLIST_FILE" 2>/dev/null || true
          fi

          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa