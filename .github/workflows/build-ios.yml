name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Overwrite Storyboard with Universal Clean XML
        run: |
          # SDK 18.1 의존성이 제거된 표준 스플래시 스토리보드로 파일 전체 덮어쓰기
          SPLASH_PATH=$(find ios -name "SplashScreen.storyboard" | head -n 1)
          if [ -n "$SPLASH_PATH" ]; then
            echo "🔧 Overwriting $SPLASH_PATH with SDK-agnostic universal XML..."
            cat << 'EOF' > "$SPLASH_PATH"
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" systemVersion="22A380" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="EXPO-VIEWCONTROLLER-1">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21678"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EXPO-SCENE-1">
                      <objects>
                          <viewController storyboardIdentifier="SplashScreenViewController" id="EXPO-VIEWCONTROLLER-1" sceneMemberDrawingMenu="never" instantiateFirstResponder="false" viewControllerKey="EXPO-VIEWCONTROLLER-1" customClass="SplashScreenViewController" customModule="SchoolApp" customModuleProvider="target">
                              <view key="view" contentMode="scaleToFill" id="EXPO-VIEW-1">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <viewLayoutGuide key="safeArea" id="EXPO-SAFEAREA-1"/>
                                  <color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="EXPO-PLACEHOLDER-1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="0.0" y="0.0"/>
                  </scene>
              </scenes>
          </document>
          EOF
            echo "✅ Storyboard successfully replaced."
          fi

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing for Pods
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              end
            end
            project.save
          '

      - name: Archive Unsigned App
        run: |
          cd ios
          set -o pipefail
          export NODE_BINARY=$(which node)
          
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath "$(pwd)/build/SchoolApp.xcarchive" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     SKIP_INSTALL=NO \
                     archive 2>&1 | tee xcodebuild.log || {
                       echo "### ❌ Xcode Archive Error Log" >> $GITHUB_STEP_SUMMARY
                       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                       grep -E "error:|BUILD FAILED" xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY
                       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                       exit 1
                     }

      - name: Package Unsigned IPA from Archive
        run: |
          rm -rf Payload app-unsigned.ipa
          mkdir -p Payload

          ARCHIVE_APP=$(find ios -name "SchoolApp.app" -type d | grep -i "xcarchive" | head -n 1)

          if [ -z "$ARCHIVE_APP" ]; then
            ARCHIVE_APP=$(find ios -name "SchoolApp.app" -type d | head -n 1)
          fi

          if [ -z "$ARCHIVE_APP" ]; then
            echo "❌ ERROR: Archived SchoolApp.app not found!"
            exit 1
          fi

          echo "✅ Found App Bundle at: $ARCHIVE_APP"

          cp -R "$ARCHIVE_APP" Payload/

          PLIST_FILE="Payload/SchoolApp.app/Info.plist"
          if [ -f "$PLIST_FILE" ]; then
            plutil -replace CFBundleIdentifier -string "com.aesias.SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleExecutable -string "SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleName -string "SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleDisplayName -string "SchoolApp" "$PLIST_FILE" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$PLIST_FILE" 2>/dev/null || true
          fi

          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa