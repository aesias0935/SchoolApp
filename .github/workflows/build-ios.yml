name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Create .env File
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          EOF

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing for Pods
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              end
            end
            project.save
          '

      - name: Archive Unsigned App
        run: |
          cd ios
          set -o pipefail
          export NODE_BINARY=$(which node)
          
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$(pwd)/build/SchoolApp.xcarchive" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     SKIP_INSTALL=NO \
                     archive 2>&1 | tee xcodebuild.log || {
                       echo "### ❌ Xcode Archive Error Log" >> $GITHUB_STEP_SUMMARY
                       echo "```" >> $GITHUB_STEP_SUMMARY
                       grep -E "error:|BUILD FAILED" xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY
                       echo "```" >> $GITHUB_STEP_SUMMARY
                       exit 1
                     }

      - name: Package Unsigned IPA from Archive
        run: |
          rm -rf Payload app-unsigned.ipa
          mkdir -p Payload

          ARCHIVE_APP=$(find ios -name "SchoolApp.app" -type d | grep -i "xcarchive" | head -n 1)

          if [ -z "$ARCHIVE_APP" ]; then
            ARCHIVE_APP=$(find ios -name "SchoolApp.app" -type d | head -n 1)
          fi

          if [ -z "$ARCHIVE_APP" ]; then
            echo "❌ ERROR: Archived SchoolApp.app not found!"
            exit 1
          fi

          cp -R "$ARCHIVE_APP" Payload/

          # 1. 메인 앱 Info.plist 설정
          PLIST_FILE="Payload/SchoolApp.app/Info.plist"
          if [ -f "$PLIST_FILE" ]; then
            plutil -replace CFBundleIdentifier -string "com.aesias.SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleExecutable -string "SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleName -string "SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleDisplayName -string "SchoolApp" "$PLIST_FILE" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$PLIST_FILE" 2>/dev/null || true
          fi

          # 2. 모든 PlugIns(위젯) Info.plist를 WidgetKit 확장 규격으로 변환
          find Payload/SchoolApp.app/PlugIns -name "Info.plist" 2>/dev/null | while read -r WIDGET_PLIST; do
            echo "🔧 Fixing Widget Info.plist at: $WIDGET_PLIST"
            
            # 잘못된 구형 스토리보드/클래스 키 삭제
            plutil -remove NSExtension.NSExtensionPrincipalClass "$WIDGET_PLIST" 2>/dev/null || true
            plutil -remove NSExtension.NSExtensionMainStoryboard "$WIDGET_PLIST" 2>/dev/null || true
            
            # WidgetKit 필수 식별자 주입
            plutil -replace NSExtension -xml '<dict><key>NSExtensionPointIdentifier</key><string>com.apple.widgetkit-extension</string></dict>' "$WIDGET_PLIST"
            
            echo "📄 Updated Info.plist Content:"
            plutil -p "$WIDGET_PLIST"
          done

          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa