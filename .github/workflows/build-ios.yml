name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing for Pods
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              end
            end
            project.save
          '

      - name: Build Unsigned App
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath "$(pwd)/build" \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     build 2>&1 | tee xcodebuild.log || {
                       echo "### ❌ Xcode Build Log (Errors)" >> $GITHUB_STEP_SUMMARY
                       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                       grep -E "error:|BUILD FAILED" xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY
                       echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                       exit 1
                     }

      - name: Package Unsigned IPA
        run: |
          rm -rf Payload app-unsigned.ipa
          mkdir -p Payload

          APP_PATH=$(find ios -name "SchoolApp.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: SchoolApp.app directory was not found!"
            exit 1
          fi

          echo "✅ Found App bundle at: $APP_PATH"

          # Info.plist가 없으면 복사
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            PLIST_SRC=$(find ios -name "Info.plist" | grep -v "Pods" | head -n 1)
            if [ -n "$PLIST_SRC" ]; then
              cp "$PLIST_SRC" "$APP_PATH/Info.plist"
            fi
          fi

          # CFBundleIdentifier 변수를 실제 Bundle ID로 강제 치환 (Sideloadly 오류 해결)
          PLIST_FILE="$APP_PATH/Info.plist"
          if [ -f "$PLIST_FILE" ]; then
            echo "🔧 Fixing CFBundleIdentifier in Info.plist..."
            plutil -replace CFBundleIdentifier -string "com.aesias.SchoolApp" "$PLIST_FILE"
            plutil -replace CFBundleExecutable -string "SchoolApp" "$PLIST_FILE" 2>/dev/null || true
            plutil -replace CFBundleName -string "SchoolApp" "$PLIST_FILE" 2>/dev/null || true
            echo "✅ BundleIdentifier set to: com.aesias.SchoolApp"
          fi

          cp -R "$APP_PATH" Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa