name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: npx pod-install ios

      - name: Align Deployment Targets & Disable Code Signing
        run: |
          sudo gem install xcodeproj
          ruby -r xcodeproj -e '
            ["ios/SchoolApp.xcodeproj", "ios/Pods/Pods.xcodeproj"].each do |path|
              next unless File.exist?(path)
              project = Xcodeproj::Project.open(path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "16.0"
                end
              end
              project.save
            end
          '

      - name: Patch Storyboard Version Conflicts
        run: |
          ruby -e '
            Dir.glob("ios/**/*.storyboard").each do |f|
              content = File.read(f, encoding: "UTF-8")
              new_content = content.gsub("18.1", "16.0")
              File.write(f, new_content)
            end
          '

      - name: Build Unsigned App
        run: |
          cd ios
          set -o pipefail
          xcodebuild -workspace SchoolApp.xcworkspace \
                     -scheme SchoolApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: .app file was not generated by xcodebuild!"
            exit 1
          fi

          echo "✅ Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-unsigned.ipa